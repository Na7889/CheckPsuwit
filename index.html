<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NW Class Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#14284b;--gold:#b8923a;--navy2:color-mix(in srgb,var(--navy),#fff 18%);--bg:#f6f7fa;--card:#fff;--ink:#1c2433;--mut:#6b7488;--line:#e3e7ef;--soft:#eef1f7;--nudge:#fbf6e8;--hd:var(--navy);--ok:#1f8a5b;--warn:#c27b12;--bad:#c0392b}
body.dark{--bg:#0f1624;--card:#18223a;--ink:#e8edf8;--mut:#98a3bd;--line:#2a3652;--soft:#26324a;--nudge:#2f2c1c;--hd:#e8edf8;--navy2:color-mix(in srgb,var(--navy),#fff 32%)}
body.dark .btn:not(.gold):not(.ok):not(.bad):not(.ghost){background:var(--navy2)}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 Sarabun,sans-serif;background:radial-gradient(circle at 92% -8%,color-mix(in srgb,var(--gold) 20%,transparent),transparent 38%),radial-gradient(circle at -8% 35%,color-mix(in srgb,var(--navy) 12%,transparent),transparent 40%),var(--bg);background-attachment:fixed;color:var(--ink)}
h1,h2,h3{font-family:Prompt,sans-serif;margin:0 0 .6rem;color:var(--hd)}h2{font-size:1.25rem}h3{font-size:1.05rem}
.btn{font:inherit;font-weight:500;border:0;background:var(--navy);color:#fff;padding:.55rem 1.1rem;border-radius:10px;cursor:pointer;transition:transform .15s,background .2s}
.btn:hover{background:var(--navy2)}.btn:active{transform:scale(.96)}.btn.gold{background:var(--gold)}.btn.ghost{background:transparent;color:var(--hd);border:1px solid var(--line)}
.btn.sm{padding:.25rem .7rem;font-size:.9rem}.btn.bad{background:var(--bad)}.btn.ok{background:var(--ok)}
input,select{font:inherit;width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus,select:focus,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
label.f{display:block;font-size:.88rem;color:var(--mut);margin-bottom:.7rem}label.f input,label.f select{margin-top:.2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.2rem;margin-bottom:1rem}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 .9rem}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.sp{flex:1}.mut{color:var(--mut);font-size:.9rem}
table{width:100%;border-collapse:collapse}th,td{padding:.55rem .5rem;text-align:left;border-bottom:1px solid var(--line);font-size:.95rem}th{color:var(--mut);font-weight:500}.tw{overflow-x:auto}
.badge{display:inline-block;padding:.1rem .65rem;border-radius:99px;font-size:.82rem;background:var(--soft);color:var(--hd)}
.badge.done,.badge.approved{background:#e0f3ea;color:var(--ok)}.badge.late,.badge.pending.u{background:#fdf0d8;color:var(--warn)}.badge.rejected,.badge.over{background:#fbe3df;color:var(--bad)}
.banner{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;border-radius:16px;padding:1.4rem 1.5rem;margin-bottom:1rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;position:relative;overflow:hidden}
.banner h2{color:#fff;margin:0}.banner p{margin:.2rem 0 0;color:rgba(255,255,255,.8)}.bd{align-self:flex-end;color:var(--gold);font-weight:600;position:relative;z-index:1}
.banner::after{content:"";position:absolute;right:-40px;top:-70px;width:190px;height:190px;border-radius:50%;background:color-mix(in srgb,var(--gold) 38%,transparent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-bottom:1rem}
.stat{display:flex;gap:.8rem;align-items:center;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:14px;padding:.9rem 1rem}
.stat b{font:600 1.8rem/1 Prompt,sans-serif;color:var(--hd)}.si{font-size:1.7rem}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr 28px;gap:.6rem;align-items:center;font-size:.9rem}
.pbar{height:9px;background:var(--soft);border-radius:5px;overflow:hidden;margin:.35rem 0}.pbar i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--gold),var(--navy2));border-radius:5px;animation:gw 1s ease-out}@keyframes gw{from{width:0}}
.task.clk{cursor:pointer;transition:transform .15s,box-shadow .2s}.task.clk:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,40,75,.14)}.task .sp{min-width:0}.task .col{display:flex;flex-direction:column;gap:.4rem}
.pl{display:flex;justify-content:space-between;gap:.5rem;padding:.35rem 0;border-bottom:1px dashed var(--line);font-size:.93rem}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}.g2s{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.swr{display:flex;gap:.5rem;margin-bottom:.8rem;flex-wrap:wrap}.sw{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);cursor:pointer;transition:transform .15s}.sw:hover{transform:scale(1.15)}
input[type=color]{padding:.1rem;height:40px}
#mas{position:fixed;right:14px;bottom:10px;width:90px;z-index:15}#mas svg{width:100%;cursor:pointer;overflow:visible;display:block}
#bub{position:absolute;right:6px;bottom:100%;background:var(--card);color:var(--ink);border:2px solid var(--gold);border-radius:14px;padding:.4rem .75rem;font-size:.85rem;width:max-content;max-width:210px;opacity:0;transform:translateY(6px) scale(.95);transition:.25s;pointer-events:none}#bub.show{opacity:1;transform:none}
.bob{animation:bob 2.2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-5px)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.arm{transform-box:fill-box;transform-origin:50% 15%;animation:wave 1.4s ease-in-out infinite alternate}@keyframes wave{from{transform:rotate(-14deg)}to{transform:rotate(28deg)}}
svg.jp{animation:jp .7s}@keyframes jp{30%{transform:translateY(-32px) rotate(-8deg)}60%{transform:translateY(0) rotate(6deg)}80%{transform:translateY(-8px)}}
@media(max-width:760px){#mas{width:66px}}
/* auth */
#auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:var(--navy);color:#fff;padding:3rem;display:flex;flex-direction:column;justify-content:center}
.hero h1{color:#fff;font-size:2.4rem;line-height:1.25}.hero p{color:#c4cde2;max-width:30ch}
.hero .stack{margin-top:2rem;display:flex;gap:.6rem}.hero .stack i{width:44px;height:6px;border-radius:3px;background:var(--gold);animation:grow 1.4s ease-out both}.hero .stack i:nth-child(2){animation-delay:.2s;opacity:.7}.hero .stack i:nth-child(3){animation-delay:.4s;opacity:.4}
@keyframes grow{from{width:0}}
.box{padding:2.5rem;display:flex;flex-direction:column;justify-content:center;max-width:430px;width:100%;margin:auto}
.tabs{display:flex;gap:.3rem;margin-bottom:1rem;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;font:inherit;padding:.6rem 1rem;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;transition:color .2s}.tab.on{color:var(--hd);border-color:var(--gold);font-weight:600}
/* app */
header{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:.7rem 1.2rem;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:5}
header b{font-family:Prompt;font-weight:600}header .btn{background:rgba(255,255,255,.14)}
nav{display:flex;gap:.3rem;padding:0 1rem;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto}
main{max-width:1000px;margin:1.2rem auto;padding:0 1rem}.swap{animation:sw .35s ease-out}@keyframes sw{from{opacity:0;transform:translateY(8px)}}
.nudge{background:var(--nudge);border-left:4px solid var(--gold);padding:.7rem 1rem;border-radius:8px;margin-bottom:1rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}.ch{color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:99px;padding:.2rem .9rem;cursor:pointer;font:inherit;font-size:.9rem}.ch.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.att label{display:inline-block;margin-right:.3rem}.att input{display:none}.att span{display:inline-block;padding:.15rem .8rem;border:1px solid var(--line);border-radius:99px;cursor:pointer;font-size:.9rem;transition:all .15s}
.att input:checked+span{color:#fff;border-color:transparent;background:var(--ok)}.att .x input:checked+span{background:var(--bad)}.att .l input:checked+span{background:var(--warn)}.att .v input:checked+span{background:var(--navy2)}
.task{display:flex;gap:1rem;align-items:center;border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;margin-bottom:.6rem;background:var(--card)}
.ring{width:130px;height:130px}.ring circle{fill:none;stroke-width:10;stroke-linecap:round}.ring .t{stroke:var(--line)}.ring .v{stroke:var(--gold);stroke-dasharray:264;transition:stroke-dashoffset 1.2s ease}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(20,40,75,.45);display:grid;place-items:center;z-index:20;animation:fi .2s}.ov.out{opacity:0;transition:opacity .2s}
.md{background:var(--card);border-radius:16px;padding:1.4rem;width:min(520px,92vw);max-height:90vh;overflow:auto;animation:pop .25s cubic-bezier(.2,1.3,.4,1)}.ma{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem}
@keyframes fi{from{opacity:0}}@keyframes pop{from{transform:scale(.9);opacity:0}}
#toasts{position:fixed;top:1rem;right:1rem;z-index:30;display:flex;flex-direction:column;gap:.5rem}
.toast{background:var(--card);border-left:5px solid var(--navy);padding:.7rem 1rem;border-radius:10px;box-shadow:0 8px 24px rgba(20,40,75,.18);animation:ti .3s ease-out;max-width:320px;display:flex;gap:.5rem}
.toast.s{border-color:var(--ok)}.toast.e{border-color:var(--bad)}.toast.out{opacity:0;transform:translateX(30px);transition:.3s}@keyframes ti{from{transform:translateX(40px);opacity:0}}
#bar{position:fixed;top:0;left:0;height:3px;background:var(--gold);width:0;z-index:40;transition:width .3s}
.pf{position:fixed;pointer-events:none;z-index:50;font-size:1.3rem;animation:pf 1s ease-out forwards}@keyframes pf{to{transform:translate(var(--x),var(--y)) rotate(200deg);opacity:0}}
@media(max-width:760px){#auth{grid-template-columns:1fr}.hero{padding:1.5rem}.hero h1{font-size:1.6rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="bar"></div><div id="toasts"></div><div id="root"></div>
<script>
const $=s=>document.querySelector(s);let T=null,U=null,D={},busy=0;
const GR=['วิทยาศาสตร์','คณิตศาสตร์','ภาษาต่างประเทศ','สังคมศึกษาและวัฒนธรรม','การงานอาชีพและเทคโนโลยี','ภาษาไทย','ศิลปะ','สุขศึกษาและพละศึกษา'];
const ROLE={teacher:'คุณครู',academic:'ฝ่ายวิชาการ',student:'นักเรียน',admin:'ผู้ดูแลระบบ'};
const ST=['มา','ขาด','สาย','ลา'],CLS=['','x','l','v'];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowTH=()=>new Date().toLocaleString('sv-SE',{timeZone:'Asia/Bangkok'}).slice(0,16).replace(' ','T');
const today=()=>nowTH().slice(0,10);
const nd=d=>!d?'':d.length==10?d+'T23:59':d;
const isOver=d=>!!d&&nd(d)<nowTH();
const dtv=d=>nd(d).slice(0,16);
const fmtDue=d=>!d?'-':d.length==10?d:d.replace('T',' ')+' น.';
const lvOpts=v=>[1,2,3,4,5,6].map(g=>`<optgroup label="มัธยมศึกษาปีที่ ${g}">${Array.from({length:12},(_,i)=>`<option ${v==`ม.${g}/${i+1}`?'selected':''}>ม.${g}/${i+1}</option>`).join('')}</optgroup>`).join('');
const fld=(l,n,v='',t='text')=>`<label class="f">${l}<input name="${n}" type="${t}" value="${esc(v)}"></label>`;
const sel=(l,n,o,v)=>`<label class="f">${l}<select name="${n}">${o.map(x=>{x=Array.isArray(x)?x:[x,x];return`<option value="${esc(x[0])}" ${x[0]==v?'selected':''}>${esc(x[1])}</option>`}).join('')}</select></label>`;
const lvSel=(l,n,v)=>`<label class="f">${l}<select name="${n}">${lvOpts(v)}</select></label>`;
const fv=m=>{const o={};m.querySelectorAll('[name]').forEach(e=>o[e.name]=e.value);return o};

function toast(m,t='i'){const d=document.createElement('div');d.className='toast '+t;d.innerHTML=`<b>${{s:'✓',e:'!',i:'i'}[t]}</b><span>${esc(m)}</span>`;$('#toasts').append(d);if(t=='s'){jump();say(['เยี่ยมเลย!','เก่งมาก!','สำเร็จแล้ว 🎉'][Math.random()*3|0])}setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),300)},3300)}
function modal(title,body,ok='ยืนยัน',get){return new Promise(res=>{const m=document.createElement('div');m.className='ov';m.innerHTML=`<div class="md"><h3>${title}</h3><div>${body}</div><div class="ma"><button class="btn ghost" id="mc">ยกเลิก</button><button class="btn" id="mo">${ok}</button></div></div>`;document.body.append(m);
const close=v=>{m.classList.add('out');setTimeout(()=>m.remove(),200);res(v)};m.querySelector('#mc').onclick=()=>close(null);m.querySelector('#mo').onclick=()=>close(get?get(m):fv(m));m.onclick=e=>{if(e.target==m)close(null)};m.onkeydown=e=>{if(e.key=='Enter'&&e.target.type=='password')m.querySelector('#mo').click()};const f=m.querySelector('input,select');f&&f.focus()})}
const confirmBox=(t,msg,ok)=>modal(t,`<p>${msg}</p>`,ok||'ยืนยัน',()=>true);
function burst(e){const r=e.target.getBoundingClientRect();for(let i=0;i<14;i++){const s=document.createElement('span');s.className='pf';s.textContent=['✨','🎉','⭐'][i%3];s.style.cssText=`left:${r.left+r.width/2}px;top:${r.top}px;--x:${(Math.random()-.5)*240}px;--y:${-60-Math.random()*140}px`;document.body.append(s);setTimeout(()=>s.remove(),1000)}}

const API_URL='https://script.google.com/macros/s/AKfycbwnvrOf2-Yn0STVlo6tTunYu1bKdxvxSZR56pvM6wiF1IkqTlPZVz3Ydt1o8_-FHMpF/exec'; // URL ที่ได้จากการ Deploy Apps Script (ลงท้ายด้วย /exec)
function api(a,p){busy++;$('#bar').style.width='70%';
return fetch(API_URL,{method:'POST',body:JSON.stringify({a,t:T,p:p||{}})}).then(r=>r.json()).then(r=>{end();if(r&&r.auth)logout(1);if(r&&r.err){toast(r.err,'e');return null}return r})
.catch(()=>{end();toast('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบ API_URL และการ Deploy','e');return null})}
function end(){if(--busy<=0){$('#bar').style.width='100%';setTimeout(()=>$('#bar').style.width=0,250)}}

/* ---------- Auth ---------- */
function authView(mode='in'){
$('#root').innerHTML=`<div id="auth"><div class="hero"><h1>ติดตามงาน<br>เช็คชื่อ ส่งงาน<br>ในที่เดียว</h1><p>ระบบสำหรับคุณครู ฝ่ายวิชาการ และนักเรียน</p><div class="stack"><i></i><i></i><i></i></div></div>
<div class="box"><button class="btn ghost sm" style="align-self:flex-end;margin-bottom:.6rem" onclick="settings()">⚙ ตั้งค่า</button><div class="tabs"><button class="tab ${mode=='in'?'on':''}" onclick="authView('in')">เข้าสู่ระบบ</button><button class="tab ${mode=='up'?'on':''}" onclick="authView('up')">ลงทะเบียน</button><button class="tab ${mode=='ad'?'on':''}" onclick="authView('ad')">ผู้ดูแลระบบ</button></div><div id="af">
${mode=='in'?fld('ชื่อผู้ใช้ (นักเรียนใช้รหัสนักเรียน)','username')+fld('รหัสผ่าน','password','','password')+'<button class="btn" style="width:100%" onclick="doLogin()">เข้าสู่ระบบ</button>':''}
${mode=='up'?sel('บทบาท','role',[['student','นักเรียน'],['teacher','คุณครู'],['academic','ฝ่ายวิชาการ']])+fld('ชื่อผู้ใช้ (นักเรียนใช้รหัสนักเรียน)','username')+fld('ชื่อ-นามสกุล (ครูใช้ชื่อให้ตรงกับที่ฝ่ายวิชาการจะเลือก)','name')+fld('รหัสผ่าน','password','','password')+'<button class="btn" style="width:100%" onclick="doReg()">ส่งคำขอลงทะเบียน</button><p class="mut">ทุกบัญชีต้องรอแอดมินอนุมัติก่อนเข้าใช้งาน</p>':''}
${mode=='ad'?fld('Key ผู้ดูแลระบบ','key','','password')+'<button class="btn gold" style="width:100%" onclick="doAdmin()">เข้าสู่ระบบแอดมิน</button>':''}
</div></div></div>`;
document.querySelectorAll('#af input').forEach(i=>i.onkeydown=e=>{if(e.key=='Enter')document.querySelector('#af .btn').click()})}
const af=()=>fv($('#af'));
async function doLogin(){enter(await api('login',af()))}
async function doAdmin(){enter(await api('login',af()))}
async function doReg(){const r=await api('register',af());if(r){await modal('ส่งคำขอแล้ว','<p>รอแอดมินอนุมัติ แล้วจึงเข้าสู่ระบบได้</p>','เข้าใจแล้ว',()=>1);authView('in')}}
function enter(r){if(!r)return;T=r.token;U=r.user;toast('ยินดีต้อนรับ '+U.name,'s');shell();say('สวัสดี '+U.name+' วันนี้ลุยกันเลย!')}
function logout(x){T=U=null;if(x)toast('กรุณาเข้าสู่ระบบอีกครั้ง','i');authView()}

/* ---------- Shell ---------- */
const NAV={admin:[['ภาพรวม',vHomeAdmin],['คำขอและผู้ใช้',vAdmin]],academic:[['ภาพรวม',vHomeAcad],['รายวิชา',vSubjects],['นักเรียน',vStudents],['สรุปการเข้าเรียน',vSummary]],teacher:[['ภาพรวม',vHomeTeacher],['เช็คชื่อ',vCheck],['ภาระงาน',vTasks]],student:[['ภาพรวม',vStats],['งานของฉัน',vMine]]};
function shell(){$('#root').innerHTML=`<header><b>NW Class Tracker</b><span class="sp"></span><span>${esc(U.name)} <span class="badge">${ROLE[U.role]}</span></span><button class="btn sm" onclick="settings()">⚙</button><button class="btn sm" onclick="logout()">ออก</button></header><nav>${NAV[U.role].map((n,i)=>`<button class="tab" id="t${i}" onclick="go(${i})">${n[0]}</button>`).join('')}</nav><main id="main"></main>`;go(0)}
async function go(i){document.querySelectorAll('nav .tab').forEach((t,j)=>t.classList.toggle('on',i==j));const m=$('#main');m.innerHTML='';const d=document.createElement('div');d.className='swap';m.append(d);await NAV[U.role][i][1](d)}
const reload=()=>{const i=[...document.querySelectorAll('nav .tab')].findIndex(t=>t.classList.contains('on'));go(i)};
const mk=(h,id)=>`<div class="tw">${h}</div>`;

/* ---------- Admin ---------- */
async function vAdmin(el){const r=await api('users');if(!r)return;D.u=r;const p=r.filter(x=>x.status=='pending');
el.innerHTML=`${p.length?`<div class="nudge">มี <b>${p.length}</b> คำขอรอการอนุมัติ — ตอบรับหรือปฏิเสธได้จากตารางด้านล่าง</div>`:'<div class="nudge">ไม่มีคำขอค้างอยู่ ทุกอย่างเรียบร้อยดี</div>'}
<div class="card"><h2>ผู้ใช้ทั้งหมด</h2>${r.length?`<div class="tw"><table><tr><th>ชื่อผู้ใช้</th><th>ชื่อ</th><th>บทบาท</th><th>สถานะ</th><th></th></tr>${r.sort((a,b)=>(b.status=='pending')-(a.status=='pending')).map((x,i)=>`<tr><td>${esc(x.username)}</td><td>${esc(x.name)}</td><td>${ROLE[x.role]}</td><td><span class="badge ${x.status}">${{pending:'รออนุมัติ',approved:'อนุมัติแล้ว',rejected:'ปฏิเสธ'}[x.status]}</span></td><td class="row">
${x.status!='approved'?`<button class="btn sm ok" onclick="setSt(${i},'approved')">ยอมรับ</button>`:''}${x.status!='rejected'?`<button class="btn sm ghost" onclick="setSt(${i},'rejected')">ปฏิเสธ</button>`:''}<button class="btn sm bad" onclick="setSt(${i},'delete')">ลบ</button></td></tr>`).join('')}</table></div>`:'<p class="mut">ยังไม่มีผู้สมัคร</p>'}</div>`;

async function openTk(id){const r=await api('taskDetail',{id});if(!r)return;const t=r.task,ok=r.list.filter(x=>x.status!='pending'),no=r.list.filter(x=>x.status=='pending'),p=r.list.length?Math.round(ok.length/r.list.length*100):0,ov=isOver(t.due);
$('#main').innerHTML=`<div class="swap"><button class="btn ghost sm" onclick="reload()" style="margin-bottom:1rem">← กลับ</button>
<div class="card"><div class="row"><h2 class="sp">${esc(t.subjectName)} · ${esc(t.level)}</h2><span class="badge ${ov?'over':'done'}">${ov?'เลยกำหนดส่ง':'ยังไม่ถึงกำหนด'}</span></div><p>${t.topic?`เรียน: ${esc(t.topic)}<br>`:''}${t.homework?`งาน: <b>${esc(t.homework)}</b><br>`:''}<span class="mut">กำหนดส่ง ${fmtDue(t.due)}</span></p><div class="pbar"><i style="--w:${p}%"></i></div><p class="mut">ส่งแล้ว ${ok.length}/${r.list.length} คน (${p}%)</p><div class="row"><button class="btn ghost sm" id="de">แก้ไข</button><button class="btn bad sm" id="dd">ลบ</button></div></div>
<div class="g2"><div class="card"><h3>✅ ส่งแล้ว (${ok.length})</h3>${ok.length?ok.map(x=>`<div class="pl"><span>${esc(x.no)}. ${esc(x.name)}</span><span><span class="badge ${x.status}">${x.status=='late'?'ส่งสาย':'ตรงเวลา'}</span> <span class="mut">${esc(x.time.slice(5))}</span></span></div>`).join(''):'<p class="mut">ยังไม่มีใครส่ง</p>'}</div>
<div class="card"><h3>⏳ ยังไม่ส่ง (${no.length})</h3>${no.length?no.map(x=>`<div class="pl"><span>${esc(x.no)}. ${esc(x.name)}</span><span class="badge ${ov?'over':''}">${ov?'ค้างส่ง':'ยังไม่ส่ง'}</span></div>`).join(''):'<p class="mut">ส่งครบทุกคนแล้ว 🎉</p>'}</div></div></div>`;
$('#de').onclick=()=>editTk(t,()=>openTk(id));$('#dd').onclick=()=>delTk(t)}
async function editTk(x,cb){const v=await modal('แก้ไขภาระงาน',fld('วันที่','date',x.date,'date')+fld('คาบ','period',x.period,'number')+fld('เนื้อหาที่เรียน','topic',x.topic)+fld('การบ้าน/ภาระงาน','homework',x.homework)+fld('กำหนดส่ง (ใส่เวลาได้ · เวลาไทย)','due',dtv(x.due),'datetime-local'),'บันทึก');
if(v&&await api('updTask',Object.assign(v,{id:x.id}))){toast('บันทึกแล้ว','s');(cb||reload)()}}
async function delTk(x){if(await confirmBox('ลบภาระงาน','ลบภาระงานนี้และสถานะการส่งของนักเรียน?','ลบ')&&await api('delTask',{id:x.id})){toast('ลบแล้ว','s');reload()}}

/* ---------- Student ---------- */
const SL={pending:'ยังไม่ทำ',done:'ส่งแล้ว',late:'ส่งสาย'};
async function vMine(el){const r=await api('tasks');if(!r)return;if(r.noReg){el.innerHTML='<div class="nudge">ฝ่ายวิชาการยังไม่ได้ลงทะเบียนรหัสนักเรียนของคุณ โปรดติดต่อฝ่ายวิชาการ</div>';return}
D.m=r.tasks;const subs=[...new Set(r.tasks.map(t=>t.subjectName))];D.f=D.f||'';const left=r.tasks.filter(t=>t.status=='pending').length;
const list=r.tasks.map((t,i)=>[t,i]).filter(([t])=>!D.f||t.subjectName==D.f);
el.innerHTML=`<div class="nudge">${!r.tasks.length?'ยังไม่มีงานในตอนนี้ พักผ่อนได้เลย 🌿':left?`เหลืออีก <b>${left}</b> งาน — เริ่มจากงานที่ใกล้กำหนดส่งก่อนนะ 💪`:'ส่งครบทุกงานแล้ว เยี่ยมมาก! 🎉'}</div>
<div class="chips"><button class="ch ${D.f?'':'on'}" onclick="D.f='';reload()">ทุกวิชา</button>${subs.map(s=>`<button class="ch ${D.f==s?'on':''}" onclick="D.f=this.dataset.s;reload()" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div>
${list.map(([t,i])=>{const over=t.status=='pending'&&isOver(t.due);return`<div class="task"><div class="sp"><b>${esc(t.subjectName)}</b> <span class="mut">${t.date}</span><div>${t.topic?`เรียน: ${esc(t.topic)}`:''}</div><div>${t.homework?`งาน: <b>${esc(t.homework)}</b>`:''}</div><div class="mut">กำหนดส่ง ${fmtDue(t.due)}</div></div>
<span class="badge ${over?'over':t.status}">${over?'เลยกำหนด':SL[t.status]}</span>${t.status=='pending'?`<button class="btn sm ok" onclick="sendTk(${i},event)">ส่งงาน</button>`:`<button class="btn sm ghost" onclick="undoTk(${i})">ยกเลิก</button>`}</div>`}).join('')}`}
async function sendTk(i,e){const o=await api('submit',{id:D.m[i].id});if(o){if(o.status=='late')toast('ส่งแล้ว แต่เลยกำหนดไปนิดนะ คราวหน้าเร็วขึ้นอีกหน่อย','i');else{toast('ส่งงานสำเร็จ เก่งมาก!','s');burst(e)}setTimeout(reload,500)}}
async function undoTk(i){if(await confirmBox('ยกเลิกการส่งงาน','ต้องการยกเลิกสถานะส่งงานนี้?')&&await api('submit',{id:D.m[i].id,undo:1})){toast('ยกเลิกแล้ว','s');reload()}}
async function vStats(el){const r=await api('tasks');if(!r)return;if(r.noReg){el.innerHTML='<div class="nudge">ฝ่ายวิชาการยังไม่ได้ลงทะเบียนรหัสนักเรียนของคุณ โปรดติดต่อฝ่ายวิชาการ</div>';return}
const t=r.tasks,g=s=>t.filter(x=>x.status==s),n=t.length,d=g('done').length+g('late').length,p=n?d/n:0,ov=t.filter(x=>x.status=='pending'&&isOver(x.due)).length,nx=t.find(x=>x.status=='pending'&&!isOver(x.due)&&x.due);
const col=(h,a)=>`<div class="card"><h3>${h} (${a.length})</h3>${a.length?a.map(x=>`<div class="mut" style="margin-bottom:.4rem"><b style="color:var(--ink)">${esc(x.subjectName)}</b> ${esc(x.homework||x.topic)}${x.due?` · ${fmtDue(x.due)}`:''}</div>`).join(''):'<span class="mut">-</span>'}</div>`;
el.innerHTML=banner('สวัสดี '+esc(U.name),r.level?'ห้อง '+esc(r.level):'')+`<div class="stats">${stat('📝',n,'งานทั้งหมด')}${stat('✅',d,'ส่งแล้ว')}${stat('⏳',g('pending').length,'ยังไม่ทำ')}${stat('🔴',ov,'เลยกำหนด')}</div>
<div class="g2"><div class="card row"><svg class="ring" viewBox="0 0 100 100"><circle class="t" cx="50" cy="50" r="42"/><circle class="v" cx="50" cy="50" r="42" transform="rotate(-90 50 50)" style="stroke-dashoffset:264"/><text x="50" y="56" text-anchor="middle" font-size="20" font-family="Prompt" style="fill:var(--hd)">${Math.round(p*100)}%</text></svg><div><h3>ความคืบหน้า</h3><div class="mut">ส่งแล้ว ${d} จาก ${n} งาน</div></div></div>
<div class="card"><h3>งานถัดไป</h3>${nx?`<p><b>${esc(nx.subjectName)}</b> · ${esc(nx.homework||nx.topic)}<br><span class="mut">กำหนดส่ง ${fmtDue(nx.due)}</span></p><button class="btn gold" onclick="go(1)">ไปส่งงาน</button>`:'<p class="mut">ไม่มีงานค้างที่ใกล้ถึงกำหนด 🌿</p>'}</div></div>
<div class="g2">${col('ส่งแล้ว',g('done'))}${col('ส่งสาย',g('late'))}${col('ยังไม่ทำ',g('pending'))}</div>`;
cnt(el);setTimeout(()=>{const v=el.querySelector('.v');if(v)v.style.strokeDashoffset=264*(1-p)},60)}

/* ---------- Settings & mascot ---------- */
const PAL={'กรมท่า':['#14284b','#b8923a'],'เขียวป่า':['#17493a','#c9a227'],'ม่วงองุ่น':['#46285e','#d68a3c'],'ฟ้าทะเล':['#0e4a6b','#e0a93b'],'ชมพูพีช':['#8a2f55','#f0a35e'],'หินชนวน':['#2b3445','#4aa3a0']};
let CF={p:'#14284b',a:'#b8923a',dark:0,m:'cat'};try{Object.assign(CF,JSON.parse(localStorage.nwset||'{}'))}catch(e){}
function paint(){const r=document.documentElement.style;r.setProperty('--navy',CF.p);r.setProperty('--gold',CF.a);document.body.classList.toggle('dark',!!CF.dark)}
function applyCF(){paint();try{localStorage.nwset=JSON.stringify(CF)}catch(e){}drawMascot()}
function settings(){const bak=Object.assign({},CF);
const sw=Object.entries(PAL).map(([k,v])=>`<button class="sw" title="${k}" data-k="${k}" style="background:linear-gradient(135deg,${v[0]} 55%,${v[1]} 55%)"></button>`).join('');
const pr=modal('ตั้งค่าหน้าเว็บ',`<p class="mut">ธีมสีสำเร็จรูป</p><div class="swr">${sw}</div><div class="g2s">${fld('สีหลัก','p',CF.p,'color')}${fld('สีเน้น','a',CF.a,'color')}</div>${sel('โหมดการแสดงผล','dark',[['0','สว่าง'],['1','มืด']],CF.dark?1:0)}${sel('ตัวการ์ตูน','m',[['cat','แมวน้อย'],['bear','หมีน้อย'],['bot','หุ่นยนต์'],['off','ปิด']],CF.m)}`,'บันทึก');
const m=document.querySelector('.md');
m.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{const v=PAL[b.dataset.k];m.querySelector('[name=p]').value=v[0];m.querySelector('[name=a]').value=v[1];CF.p=v[0];CF.a=v[1];paint()});
m.querySelectorAll('input[type=color]').forEach(i=>i.oninput=()=>{CF[i.name]=i.value;paint()});
m.querySelector('[name=dark]').onchange=e=>{CF.dark=+e.target.value;paint()};
pr.then(v=>{if(v){CF.p=v.p;CF.a=v.a;CF.dark=+v.dark;CF.m=v.m;applyCF();toast('บันทึกการตั้งค่าแล้ว','s')}else{Object.assign(CF,bak);paint()}})}
const EARS={cat:'<polygon points="20,38 24,8 46,26"/><polygon points="80,38 76,8 54,26"/>',bear:'<circle cx="22" cy="26" r="11"/><circle cx="78" cy="26" r="11"/>',bot:'<line x1="50" y1="24" x2="50" y2="10"/><circle cx="50" cy="8" r="5"/>'};
const TIPS={student:['ทำงานทีละชิ้น เดี๋ยวก็หมดแล้ว สู้ๆ!','ส่งงานตรงเวลา รับดาวไปเลย ⭐','พักสายตาแล้วดื่มน้ำสักแก้ว 💧'],teacher:['เช็คชื่อเสร็จ อย่าลืมใส่การบ้านด้วยนะ','ลองกดดูว่าใครยังไม่ส่งงาน 👀','ขอบคุณที่ตั้งใจสอนนะ 💛'],academic:['ตรวจสอบรายชื่อนักเรียนให้ครบหรือยัง?','ดูสรุปการเข้าเรียนได้ที่แท็บสรุป 📊'],admin:['มีคำขอใหม่รออยู่หรือเปล่านะ?','ตรวจสอบผู้ใช้เป็นระยะ ปลอดภัยไว้ก่อน 🔒'],none:['สวัสดี! กดที่ฉันดูสิ','ลองเปลี่ยนธีมสีได้ที่ปุ่ม ⚙ นะ']};
const tip=()=>{const a=TIPS[U?U.role:'none'];return a[Math.random()*a.length|0]};
let bt;function say(m){const b=$('#bub');if(!b)return;b.textContent=m;b.classList.add('show');clearTimeout(bt);bt=setTimeout(()=>b.classList.remove('show'),4500)}
function jump(){const s=document.querySelector('#mas svg');if(!s)return;s.classList.remove('jp');void s.getBoundingClientRect();s.classList.add('jp')}
function drawMascot(){let m=$('#mas');if(m)m.remove();if(CF.m=='off')return;m=document.createElement('div');m.id='mas';
m.innerHTML=`<div id="bub"></div><svg viewBox="0 0 100 100"><ellipse cx="50" cy="95" rx="26" ry="4" fill="rgba(0,0,0,.15)"/><g class="bob"><g style="fill:var(--gold);stroke:var(--gold);stroke-width:3;stroke-linejoin:round">${EARS[CF.m]||EARS.cat}</g><ellipse class="arm" cx="89" cy="64" rx="6" ry="11" style="fill:var(--gold)"/><ellipse cx="11" cy="66" rx="6" ry="11" style="fill:var(--gold)"/><circle cx="50" cy="56" r="34" style="fill:var(--gold)"/><ellipse cx="50" cy="60" rx="27" ry="23" fill="#fff"/><ellipse class="eye" cx="39" cy="56" rx="3.8" ry="5" fill="#1c2433"/><ellipse class="eye" cx="61" cy="56" rx="3.8" ry="5" fill="#1c2433"/><circle cx="30" cy="66" r="4" fill="#f4a5a5" opacity=".7"/><circle cx="70" cy="66" r="4" fill="#f4a5a5" opacity=".7"/><path d="M43 66q7 7 14 0" fill="none" stroke="#1c2433" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="38" cy="91" rx="9" ry="5" style="fill:var(--gold)"/><ellipse cx="62" cy="91" rx="9" ry="5" style="fill:var(--gold)"/></g></svg>`;
document.body.append(m);m.querySelector('svg').onclick=()=>{jump();say(tip())}}
setInterval(()=>say(tip()),55000);
applyCF();authView();setTimeout(()=>say('สวัสดี! กดที่ฉันได้นะ'),900);
</script></body></html>
